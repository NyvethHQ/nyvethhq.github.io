<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Nyveth</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .not-found-code {
      font-family: var(--font-mono);
      font-size: 5rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      letter-spacing: -0.05em;
    }
    .not-found-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .not-found-desc {
      color: var(--text-secondary);
      max-width: 460px;
      margin-bottom: 32px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="grid-background" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <span class="logo-symbol">◬</span>
        <span class="brand-name">Nyveth</span>
      </a>
    </div>
  </header>

  <main>
    <div class="container not-found-container">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">This path doesn't exist</h1>
      <p class="not-found-desc">
        The requested resource could not be found or has been moved.
      </p>
      <a href="index.html" class="btn btn-primary">Return to Nyveth →</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>&copy; <span id="current-year">2026</span> Nyveth. Independent software company.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
